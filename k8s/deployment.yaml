apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockai-demo
  namespace: stockai-demo
  labels:
    app.kubernetes.io/name: stockai-demo
    app.kubernetes.io/component: terminal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockai-demo
  template:
    metadata:
      labels:
        app: stockai-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: stockai-demo
          image: stockai-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: APP_MODE
              value: "demo"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
