services:
  stockai-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: stockai-demo:1.0.0
    container_name: stockai-demo
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - APP_MODE=demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
